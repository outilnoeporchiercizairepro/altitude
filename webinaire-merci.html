<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C'est confirmé ! — Altitude</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .thanks-hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background: var(--black);
    }
    
    .thanks-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      padding: 60px 40px;
      border-radius: 24px;
      max-width: 640px;
      width: 100%;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.1);
    }
    
    .success-icon {
      font-size: 64px;
      margin-bottom: 24px;
    }
    
    .link-box {
      background: var(--slate);
      border: 1px dashed var(--primary);
      padding: 24px;
      border-radius: 12px;
      margin: 32px 0;
      word-break: break-all;
    }
    
    .link-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--primary);
      margin-bottom: 8px;
      display: block;
    }
    
    .webinar-link {
      font-family: var(--font-corporate);
      font-weight: 700;
      color: var(--white);
      text-decoration: none;
      font-size: 18px;
    }
    
    .webinar-link:hover {
      color: var(--primary);
    }
    
    .calendar-btn {
      background: var(--white);
      color: var(--black);
      border: 1px solid var(--white);
    }
    
    .calendar-btn:hover {
      background: transparent;
      color: var(--white);
    }
    
    .buttons-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 24px;
    }
  </style>
</head>
<body>

<section class="thanks-hero">
  <div class="thanks-card fade-in">
    <div class="success-icon">🚀</div>
    <h1 style="font-family: var(--font-corporate); font-size: clamp(32px, 5vw, 48px); line-height: 1.1; margin-bottom: 20px;">
      Ton inscription est <span>confirmée</span> !
    </h1>
    <p class="hero-sub" style="margin: 0 auto; color: var(--muted);">
      Prépare-toi à découvrir comment l'IA va changer ton année 2026.
    </p>
    
    <div class="link-box">
      <span class="link-label">Lien d'accès au direct</span>
      <a href="https://zoom.us/j/votre-lien-webinaire" class="webinar-link">zoom.us/j/votre-lien-webinaire</a>
    </div>
    
    <div style="margin-bottom: 32px;">
      <div style="font-family: var(--font-corporate); font-size: 24px; font-weight: 700; color: var(--white);">
        Dimanche 17 Mai @ 20h30
      </div>
      <p style="font-size: 14px; color: var(--muted); margin-top: 4px;">(Durée estimée : 60 minutes)</p>
    </div>
    
    <div class="buttons-container">
      <a href="https://calendar.google.com/calendar/event?action=TEMPLATE&tmeid=NTYyc3ZkajY3YnJrMzdydTc2ZDFsZDJlaDAgbm9lQHByY3ouZnI&tmsrc=noe%40prcz.fr" 
         target="_blank" 
         class="cta-btn calendar-btn">
        📅 Ajouter à Google Calendar
      </a>
      <a href="index.html" style="font-size: 14px; color: var(--muted); text-decoration: underline;">Retour à l'accueil</a>
    </div>
  </div>
</section>

</body>
</html>
