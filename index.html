<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altitude — Webinaire Exclusif</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .webinar-hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background: var(--black);
    }
    
    .webinar-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      padding: 60px 40px;
      border-radius: 24px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.1);
    }
    
    .form-group {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    input[type="email"],
    input[type="text"] {
      width: 100%;
      padding: 18px 24px;
      background: var(--slate);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      color: var(--white);
      outline: none;
      transition: all 0.3s ease;
    }
    
    input[type="email"]:focus,
    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(0, 71, 255, 0.1);
    }
    
    .submit-btn {
      width: 100%;
      justify-content: center;
    }
    
    .date-tag {
      background: rgba(0, 71, 255, 0.1);
      color: var(--primary);
      padding: 8px 16px;
      border-radius: 100px;
      font-family: var(--font-corporate);
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 24px;
      display: inline-block;
    }
  </style>
</head>
<body>

<section class="webinar-hero">
  <div class="logo-container" style="width: 140px; height: 140px; margin-bottom: 24px;">
    <img src="logoaltitude.png" alt="Altitude Logo" style="width: 120px;">
  </div>
  
  <div class="webinar-card fade-in">
    <div class="date-tag">Dimanche 17 Mai • 20h30</div>
    <h1 style="font-family: var(--font-corporate); font-size: clamp(32px, 5vw, 48px); line-height: 1.3; margin-bottom: 20px;">
      Comment gagner <span>14 heures</span> par semaine grâce à l'IA en 2026
    </h1>
    <p class="hero-sub" style="margin: 0 auto; color: var(--muted);">
      Inscrivez-vous pour recevoir le lien d'accès direct et transformer votre productivité.
    </p>
    
    <form id="webinarForm" class="form-group">
      <input type="text" id="firstName" placeholder="Ton prénom" required>
      <input type="email" id="email" placeholder="Ton adresse email professionnelle" required>
      <button type="submit" class="cta-btn submit-btn">Réserver ma place gratuitement</button>
    </form>
    
    <p style="margin-top: 24px; font-size: 12px; color: var(--muted);">
      🔒 Vos données restent privées. Pas de spam, promis.
    </p>
  </div>
</section>

<script>
  document.getElementById('webinarForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const firstName = document.getElementById('firstName').value;
    const submitBtn = e.target.querySelector('button');
    
    if (email && firstName) {
      // Loading state
      const originalText = submitBtn.innerText;
      submitBtn.innerText = 'Envoi en cours...';
      submitBtn.disabled = true;

      try {
        await fetch('https://n8n.prcz.fr/webhook/webi-ac', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ 
            email, 
            firstName,
            source: 'webinaire_2026',
            date: new Date().toISOString()
          }),
        });
      } catch (error) {
        console.error('Webhook error:', error);
        // We still redirect even if webhook fails to not block the user
      } finally {
        window.location.href = 'webinaire-merci.html';
      }
    }
  });
</script>

</body>
</html>
